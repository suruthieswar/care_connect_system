<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elder Companion App</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f0f0f0;
      text-align: center;
      padding: 30px;
    }

    h1 {
      font-size: 36px;
      color: #4CAF50;
      margin-bottom: 30px;
    }

    .button-container {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 50px;
    }

    .dashboard-button {
      width: 150px;
      height: 150px;
      border: none;
      border-radius: 20px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      cursor: pointer;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    .dashboard-button:hover {
      transform: scale(1.1);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
    }

    .button-label {
      font-size: 20px;
      color: #4CAF50;
      font-weight: bold;
      margin-top: 10px;
    }

    .sos-button {
      padding: 15px 30px;
      font-size: 20px;
      color: white;
      background-color: red;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin: 20px 0;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .sos-button:hover {
      background-color: darkred;
    }

    .nav-buttons {
      margin-top: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
    }

    .nav-buttons a {
      text-decoration: none;
      padding: 10px 20px;
      background-color: #4CAF50;
      color: white;
      border-radius: 5px;
      font-size: 18px;
      font-family: Arial, sans-serif;
      transition: background-color 0.3s ease;
    }

    .nav-buttons a:hover {
      background-color: #0056b3;
    }

    .voice-status {
      font-size: 16px;
      color: #4CAF50;
      margin-top: 20px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>QUICK ACCESS</h1>

  <div class="button-container">
    <!-- Calculator Button -->
    <div>
      <button class="dashboard-button" 
              style="background-image: url('https://static.vecteezy.com/system/resources/previews/013/127/325/original/hand-drawn-calculator-illustration-png.png');" 
              onclick="window.location.href='calculator.html';"></button>
      <div class="button-label">Calculator</div>
    </div>

    <!-- SOS Button -->
    <div>
      <button class="dashboard-button" 
              style="background-image: url('https://static.vecteezy.com/system/resources/previews/014/291/004/non_2x/sos-icon-design-illustration-vector.jpg');" 
              onclick="sendSOS();"></button>
      <div class="button-label">SOS</div>
    </div>

    <!-- User Manual Button -->
    <div>
      <button class="dashboard-button" 
              style="background-image: url('https://cdn-icons-png.flaticon.com/512/10000/10000766.png');" 
              onclick="window.location.href='user.html';"></button>
      <div class="button-label">User Manual</div>
    </div>
  </div>

  <p class="voice-status" id="voiceStatus">Listening for voice commands...</p>

  <div class="nav-buttons">
    <a href="elder_dashboard.php">Home</a>
  </div>

  <script>
    let sosAlertSent = false;

    function sendSOS() {
      if (sosAlertSent) {
        console.log("SOS alert already sent; awaiting confirmation.");
        return;
      }

      console.log("Sending SOS alert...");

      fetch('http://localhost:3000/sos', {
          method: 'POST',
          headers: {
              'Content-Type': 'application/json'
          },
          body: JSON.stringify({
              message: "This is an SOS alert! Please assist immediately.",
              recipient: "+916385274064"
          })
      })
      .then(response => response.json())
      .then(data => {
          if (data.success) {
              document.getElementById("voiceStatus").textContent = 
                "SOS Alert Sent Successfully! Say 'ok' to confirm.";
              sosAlertSent = true;
          } else {
              alert(`Failed to send SOS Alert. Error: ${data.error}`);
          }
      })
      .catch(error => {
          console.error('Error:', error);
          alert('An error occurred while sending the SOS alert.');
      });
    }

    window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if ('SpeechRecognition' in window) {
      const recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.lang = 'en-US';

      recognition.onresult = function(event) {
        const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase().trim();
        console.log("Voice Command Recognized:", transcript);

        if (sosAlertSent && transcript.includes("ok")) {
          sosAlertSent = false;
          document.getElementById("voiceStatus").textContent = "SOS submission confirmed!";
          console.log("SOS submission confirmed via voice.");
          return;
        }

        if (transcript.includes("back")) {
          window.location.href = "elder_dashboard.php";
        } else if (transcript.includes("calculator")) {
          window.location.href = "calculator.html";
        } else if (transcript.includes("sos")) {
          sendSOS();
        } else if (transcript.includes("manual")) {
          window.location.href = "user.html";
        }
      };

      recognition.onerror = function(event) {
        console.error("Speech recognition error:", event.error);
      };

      recognition.onend = function() {
        console.log("Speech recognition ended, restarting...");
        recognition.start();
      };

      recognition.start();
    } else {
      console.warn("Speech Recognition is not supported in this browser.");
      document.getElementById("voiceStatus").textContent = "Voice commands are not supported in this browser.";
    }
  </script>
</body>
</html>
