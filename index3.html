<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container text-center mt-5">
        <h1>Select a Category</h1>
        <div class="row row-cols-2 row-cols-md-3 g-4 mt-4" id="categories-container">
            <!-- Categories will be dynamically inserted here -->
        </div>
        <div class="d-flex justify-content-center mt-4">
            <button class="btn btn-outline-secondary" onclick="goBack()">Back</button>
        </div>
    </div>

    <script>
        const categories = ['Shopping', 'Grocery', 'Work', 'Personal', 'Health']; // Add your categories here

        // Dynamically generate category buttons
        const categoriesContainer = document.getElementById('categories-container');
        categories.forEach(category => {
            const colDiv = document.createElement('div');
            colDiv.classList.add('col');
            colDiv.innerHTML = `
                <div class="card border-primary" id="${category.toLowerCase()}-card" onclick="navigateToCategory('${category}')">
                    <div class="card-body">
                        <h5 class="card-title">${category}</h5>
                    </div>
                </div>
            `;
            categoriesContainer.appendChild(colDiv);
        });

        function navigateToCategory(category) {
            window.location.href = `category.html?category=${category}`;
        }

        function goBack() {
            window.history.back();
        }

        // Function to automatically click on category based on voice command
        function clickCategoryByVoiceCommand(command) {
            const categoriesMap = {
                'shopping': 'shopping-card',
                'grocery': 'grocery-card',
                'work': 'work-card',
                'personal': 'personal-card',
                'health': 'health-card'
            };

            const categoryId = categoriesMap[command.toLowerCase()];
            if (categoryId) {
                document.getElementById(categoryId).click();
            }
        }

        // Initialize Speech Recognition
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        recognition.lang = 'en-US'; // Set to English language
        recognition.continuous = true; // Keep recognizing until stopped
        recognition.interimResults = false; // Don't return partial results

        // Start recognition
        recognition.start();

        recognition.onstart = () => {
            console.log('Voice recognition started');
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error', event.error);
        };

        recognition.onresult = (event) => {
            const transcript = event.results[event.resultIndex][0].transcript.toLowerCase();
            console.log('Recognized:', transcript);

            // Check if the recognized transcript matches any category
            if (categories.includes(transcript.charAt(0).toUpperCase() + transcript.slice(1))) {
                clickCategoryByVoiceCommand(transcript);
            } else if (transcript.includes('back')) {
                goBack(); // Go back if "back" is said
            }
        };
    </script>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
