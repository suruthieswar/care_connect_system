<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elder Login</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f0f8ff, #e6f7ff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        h2 {
            font-size: 24px;
            color: #333;
            margin-bottom: 20px;
        }
        .form-container {
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h2>Login to Elder Care Connect</h2>
    <div class="form-container">
        <form id="loginForm">
            <input type="text" id="name" placeholder="Full Name" required><br>
            <input type="tel" id="phone" placeholder="Phone Number" required><br>
            <button type="submit">Login</button>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const storedName = localStorage.getItem('elderName');
            const storedPhone = localStorage.getItem('elderPhone');

            const enteredName = document.getElementById('name').value;
            const enteredPhone = document.getElementById('phone').value;

            if (enteredName === storedName && enteredPhone === storedPhone) {
                alert('Login Successful!');
                window.location.href = 'elder_dashboard.html';
            } else {
                alert('Invalid credentials, please try again.');
            }
        });
    </script>
</body>
</html>
